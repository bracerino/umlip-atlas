# Publishes dist/ to GitHub Pages on every push, and refreshes citation counts every 3 days.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/core.test.mjs
      - name: Update citation counts and open-access links
        if: github.event_name != 'push'
        run: |
          node tools/update-citations.mjs
          node tools/update-open-access.mjs || echo "Open-access lookup failed; previous links kept."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/papers.json
          git diff --cached --quiet || (git commit -m "Update citation counts and open-access links" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
